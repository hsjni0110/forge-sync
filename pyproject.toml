[project]
name = "forgesync-workspace"
version = "0.1.0"
description = "ForgeSync monorepo development workspace"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "jsonschema[format]>=4.25,<5",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/edge-gateway",
  "apps/ai-service",
  "apps/virtual-controller",
]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
  "mqtt_integration: requires the repository-local Mosquitto broker",
]
pythonpath = ["."]
testpaths = [
  "apps/edge-gateway/tests",
  "apps/ai-service/tests",
  "apps/virtual-controller/tests",
  "tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "apps/edge-gateway/src",
  "apps/ai-service/src",
  "apps/virtual-controller/src",
  "tools",
]
