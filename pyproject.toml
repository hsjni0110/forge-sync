[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "forgesync-edge-gateway"
version = "0.1.0"
description = "ForgeSync manufacturing source acquisition and edge gateway"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.scripts]
forgesync-source = "forgesync_edge.source_acquisition.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/edge-gateway/src/forgesync_edge"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["apps/edge-gateway/tests", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/edge-gateway/src"]

