management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

spring:
  datasource:
    url: ${FORGESYNC_DATABASE_URL:jdbc:postgresql://127.0.0.1:15432/forgesync}
    username: ${FORGESYNC_DATABASE_USERNAME:forgesync}
    password: ${FORGESYNC_DATABASE_PASSWORD:forgesync-test}
  flyway:
    enabled: true

forgesync:
  ingestion:
    enabled: true
  twin:
    query:
      enabled: true
    freshness:
      fresh-max-age: 2s
      lagging-max-age: 10s
  websocket:
    allowed-origins: http://localhost:5173
  mqtt:
    enabled: false
    server-uri: tcp://localhost:1883
    client-id: forgesync-api-local
  replay:
    enabled: true
    edge-base-url: ${FORGESYNC_REPLAY_EDGE_BASE_URL:http://127.0.0.1:8002}
  process-analytics:
    enabled: true
