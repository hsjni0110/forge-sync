[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "forgesync-virtual-controller"
version = "0.1.0"
description = "ForgeSync simulated command executor"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn>=0.35,<0.36",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forgesync_virtual_controller"]
