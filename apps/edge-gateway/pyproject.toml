[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "forgesync-edge-gateway"
version = "0.1.0"
description = "ForgeSync manufacturing source acquisition and edge gateway"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.141,<0.142",
  "jsonschema[format]>=4.25,<5",
  "paho-mqtt>=2.1,<3",
  "uvicorn>=0.35,<0.36",
]

[project.scripts]
forgesync-source = "forgesync_edge.source_acquisition.cli:main"
forgesync-replay = "forgesync_edge.replay.adapter.inbound.cli:main"
forgesync-replay-api = "forgesync_edge.replay.adapter.inbound.http:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forgesync_edge"]
