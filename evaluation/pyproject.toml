[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "forgesync-evaluation"
version = "0.1.0"
description = "ForgeSync comparison against preregistered naive baselines"
requires-python = ">=3.12,<3.15"
dependencies = [
  "forgesync-edge-gateway",
  "paho-mqtt>=2.1,<3",
]

[project.scripts]
forgesync-evaluation = "forgesync_evaluation.adapter.inbound.cli:main"
forgesync-evaluation-replay-api = "forgesync_evaluation.adapter.inbound.faulty_replay_api:main"
forgesync-evaluation-capture = "forgesync_evaluation.adapter.inbound.delivery_capture:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forgesync_evaluation"]

[tool.uv.sources]
forgesync-edge-gateway = { workspace = true }
